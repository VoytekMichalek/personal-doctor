name: Publish image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: |
          test "${GITHUB_REF_NAME}" = "v$(python -c 'from personal_doctor import __version__; print(__version__)')"
          git merge-base --is-ancestor HEAD origin/main
      - run: pip install -r requirements-dev.txt
      - run: ruff check personal_doctor tests migrations scripts && pytest -q
      - run: docker build -t personal-doctor:local .
      - run: python scripts/image_smoke.py
      - name: Publish verified image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag personal-doctor:local "$image:$GITHUB_REF_NAME"
          docker push "$image:$GITHUB_REF_NAME"
          docker tag personal-doctor:local "$image:latest"
          docker push "$image:latest"
