name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: doctor
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: doctor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doctor -d doctor_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check personal_doctor tests migrations scripts
      - run: pytest -q
      - run: pytest -q
        env:
          DOCTOR_TEST_DATABASE_URL: postgresql+psycopg://doctor:ci-only@127.0.0.1:5432/doctor_test
      - run: docker build -t personal-doctor:local .
      - run: python scripts/image_smoke.py
